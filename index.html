<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyBattle Arena</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- O Canvas onde o jogo inteiro será desenhado -->
    <canvas id="gameCanvas"></canvas>
    <<div id="ui-layer">
    <!-- HUD de Vida/Mana (Canto Superior Esquerdo) -->
    <div id="player-hud" class="hud-container hidden">
        <div class="bar-bg"><div id="health-bar" class="bar-fill health"></div></div>
        <div class="bar-bg"><div id="mana-bar" class="bar-fill mana"></div></div>
    </div>
    <div id="stats-hud" class="stats-container">
            <div class="stat-box">
                <span class="stat-icon" style="color: #f1c40f;">🪙</span>
                <span id="coin-counter">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-icon" style="color: #e74c3c;">💀</span>
                <span id="kill-counter">0</span>
            </div>
        </div>
    <!-- Hotbar CENTRALIZADA (Independente) -->
    <div id="hotbar" class="hotbar-container"></div>

    <!-- Informações da Magia no CANTO DIREITO -->
    <div id="spell-hud" class="spell-container">
        <div id="spell-icon" class="spell-color-box"></div>
        <div class="spell-info">
            <span id="spell-name">Míssil Arcano</span>
            <span id="spell-cost">Custo: 5 Mana</span>
        </div>
    </div>
</div>
    <!-- Usamos type="module" para suportar import/export do ES6 nativamente -->
    <script type="module" src="src/main.js"></script>
</body>
</html>
